[project]
name = "time-series-modelling"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # data sources (notebook cells 0, 1, 2)
    "yfinance",
    "gdown",
    "pandas-datareader",
    # parquet.brotli dataset reader
    "pyarrow",
    "brotli",
    # core
    "numpy",
    # Colab runtime ships pandas 2.2.3 (see pandas/core/indexes/base.py:3805 in
    # tracebacks). Pin the same version locally so notebook behaviour matches.
    "pandas==2.2.3",
    # plotting
    "matplotlib",
    "plotly",
    # statsmodels: ARIMA (cell 91)
    "statsmodels",
    # scikit-learn: DecisionTreeClassifier, SimpleImputer, metrics (cells 104, 116, 121)
    "scikit-learn",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
]

[tool.uv]
package = false
